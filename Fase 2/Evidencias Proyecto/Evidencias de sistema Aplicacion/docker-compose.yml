version: '3.8'

services:
  # 1. El servidor web principal (Pasajeros y Conductores)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8080" # Dokploy enrutará microsculipran.duckdns.org hacia aquí
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      # Las demás variables de Supabase se configurarán directamente en el panel de Dokploy

  # 2. El motor de WebSockets (Radar GPS)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    # Corrección: Comillas removidas para evitar errores de sintaxis en el shell interno
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    # PARCHE CRÍTICO: Desactivar el chequeo de salud para que Dokploy no bloquee el tráfico WSS
    healthcheck:
      disable: true
    ports:
      - "6001:8080" # Puerto independiente para la telemetría en vivo
    depends_on:
      - web