version: '3.8'

services:
  # 1. El servidor web principal (Pasajeros y Conductores)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8080" # Dokploy enrutará microsculipran.duckdns.org hacia aquí
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      # Las demás variables de Supabase se configurarán directamente en el panel de Dokploy